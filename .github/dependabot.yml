version: 2
updates:
  # npm deps in package.json; grouped so one PR covers a weekly sweep.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns: ["*"]
    # Majors need a hand-driven migration - a framework or toolchain bump
    # (Next.js, TypeScript, ESLint, Vitest, ...) reliably breaks lint/build/tests
    # and can't be validated by a bot. Keep every major out of the automated
    # group sweep; the bot still proposes minors and patches for the whole tree.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions - keeps the SHA-pinned actions current (updates the pin and
  # the version comment together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base image in the Dockerfile. The Node major is a single source of truth
  # shared with package.json `engines.node` (enforced by the CI `version` job),
  # so a major bump needs both files changed together - keep it manual and let
  # the bot handle only minor/patch of the base image.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
