{{- if .Values.namespace.create }}
# The portal's own Namespace. Created as part of the release so the namespace
# and everything scoped to it (Deployment, Service, Route, ExternalSecret,
# NetworkPolicy) ship together. Extra labels/annotations are merged onto the
# standard chart labels - handy for cost-centre labels, Istio injection, RHACS
# scoping, etc. Set `namespace.create: false` when the namespace is provisioned
# out of band.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
    {{- with .Values.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.namespace.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
